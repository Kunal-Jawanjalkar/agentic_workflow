services:
  app:
    build: .
    command: ["sh", "-c", "npm run prisma:generate && npm run dev"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/agentic_workflow
      PORT: "8001"
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    volumes:
      - ../node-types.json:/node-types.json:ro
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts:ro

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentic_workflow
      POSTGRES_PASSWORD: app
      POSTGRES_USER: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
